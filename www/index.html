<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<script>if(!window.exifr)document.write('<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"><\/script>')</script>
<style>
:root{
  --bg:#0e0f11; --panel:#17191c; --panel2:#1f2226; --line:#2b2f35;
  --text:#ececec; --mute:#9aa0a8; --accent:#ffb627; --accent2:#ff7a1a; --ok:#5fd38d; --warn:#ff6b5b;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(40px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px}
header{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.logo{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#222 0 30%,var(--accent) 31% 37%,#111 38% 60%,#333 61% 64%,#111 65%);box-shadow:0 0 0 2px #2b2f35}
h1{font-size:20px;margin:0;font-weight:900;letter-spacing:.5px}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:13px;letter-spacing:2px;color:var(--mute);margin:0 0 12px;font-weight:500;display:flex;align-items:center;gap:8px}
.card h2 .n{font-family:"JetBrains Mono",monospace;color:var(--accent);font-weight:700}
select,input[type=number]{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:15px;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.detect{font-size:13px;color:var(--mute);margin-bottom:10px;line-height:1.5}
.detect b{color:var(--ok);font-weight:500}
.lenses{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lens{font-family:"JetBrains Mono",monospace;font-size:13px;padding:6px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.lens small{color:var(--mute);font-family:"Noto Sans TC";margin-left:4px}
.lens.crop{border-style:dashed;opacity:.75}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:999px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
.row{margin-top:14px}
.lbl{font-size:13px;color:var(--mute);margin-bottom:8px;display:flex;justify-content:space-between}
.lbl b{color:var(--text);font-family:"JetBrains Mono",monospace}
input[type=range]{width:100%;accent-color:var(--accent)}
.btns{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line);text-align:center}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#111;border:0}
.btn:disabled{opacity:.5}
.btn input{display:none}
.hint{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.55}
#stage{position:relative;margin-top:12px;display:none;border-radius:12px;overflow:hidden;background:#000}
#stage canvas{display:block;width:100%;height:auto}
.metrics{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.m{font-size:12px;padding:4px 8px;border-radius:6px;background:var(--panel2);color:var(--mute)}
.m b{color:var(--text);font-weight:500}
.m.warn b{color:var(--warn)}
.result{background:linear-gradient(180deg,#1d1a12,var(--panel));border-color:#3a3220}
.big{display:flex;align-items:flex-end;gap:14px}
.zoom{font-family:"JetBrains Mono",monospace;font-size:72px;font-weight:700;line-height:.9;color:var(--accent);letter-spacing:-2px}
.zoom span{font-size:36px}
.zinfo{padding-bottom:6px}
.zinfo .t{font-size:17px;font-weight:700}
.zinfo .d{font-size:13px;color:var(--mute);margin-top:3px}
.sec{margin-top:16px}
.sec h3{font-size:13px;color:var(--accent);margin:0 0 8px;font-weight:700;letter-spacing:1px}
ul{margin:0;padding-left:0;list-style:none}
li{position:relative;padding-left:16px;font-size:14px;line-height:1.6;margin-bottom:6px}
li:before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.pos li:before{background:var(--ok)}
.warnl li:before{background:var(--warn)}
.alts{display:flex;gap:8px;flex-wrap:wrap}
.alt{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;flex:1;min-width:140px}
.alt b{font-family:"JetBrains Mono",monospace;color:var(--text);font-size:16px;display:block}
.alt span{color:var(--mute)}
.ai{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.aiout{font-size:14px;line-height:1.65;margin-top:12px}
.aiout .badge{display:inline-block;font-size:11px;background:var(--accent);color:#111;border-radius:4px;padding:1px 6px;font-weight:700;margin-right:6px;vertical-align:2px}
.err{color:var(--warn);font-size:13px;margin-top:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #111;border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.custom{display:none;margin-top:10px}
footer{color:#5d636b;font-size:11px;text-align:center;line-height:1.6;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"></div>
    <div><h1>鏡頭顧問</h1><div class="sub">依你的手機與現場，建議用幾倍、站在哪</div></div>
  </header>

  <section class="card">
    <h2><span class="n">01</span>你的手機</h2>
    <div class="detect" id="detect">正在辨識機型…</div>
    <select id="phone"></select>
    <div class="custom" id="customBox">
      <div class="lbl">輸入你相機 App 裡的倍數按鈕（逗號分隔）</div>
      <input id="customZ" type="number" style="display:none">
      <select id="customPreset">
        <option value="0.5,1,2">0.5× / 1× / 2×</option>
        <option value="0.5,1,3">0.5× / 1× / 3×</option>
        <option value="0.6,1,3">0.6× / 1× / 3×</option>
        <option value="0.5,1,3,5">0.5× / 1× / 3× / 5×</option>
        <option value="0.6,1,3,6">0.6× / 1× / 3× / 6×</option>
        <option value="1,2">1× / 2×（單鏡頭）</option>
      </select>
    </div>
    <div class="lenses" id="lenses"></div>
  </section>

  <section class="card">
    <h2><span class="n">02</span>你要拍什麼</h2>
    <div class="chips" id="scenes"></div>
    <div class="row" id="framingRow">
      <div class="lbl">取景範圍</div>
      <div class="chips" id="framing"></div>
    </div>
    <div class="row">
      <div class="lbl">你和主體的距離 <b id="distV">3 m</b></div>
      <input type="range" id="dist" min="0" max="1000" value="400">
    </div>
    <div class="row" id="sizeRow">
      <div class="lbl">主體大小（高或寬，取較長邊）<b id="sizeV">1.8 m</b></div>
      <input type="range" id="size" min="0" max="1000" value="500">
    </div>
  </section>

  <section class="card">
    <h2><span class="n">03</span>現場測光（建議）</h2>
    <div class="btns">
      <label class="btn primary">📷 用 1× 拍張測試照<input type="file" id="cam" accept="image/*" capture="environment"></label>
      <label class="btn">從相簿選<input type="file" id="lib" accept="image/*"></label>
    </div>
    <div class="hint">用 1× 對著要拍的方向拍一張就好。照片只在你的瀏覽器裡分析；照片裡的 EXIF 也能直接告訴我們是哪支手機。</div>
    <div id="stage"><canvas id="cv"></canvas></div>
    <div class="metrics" id="metrics"></div>
  </section>

  <section class="card result" id="result"></section>

  <footer>鏡頭規格為概略值，各地版本可能不同。<br>倍數以相機 App 的 1×（主鏡頭）為基準，焦距為 35mm 等效。</footer>
</div>

<script>
/* ---------------- 手機鏡頭資料庫 ---------------- */
// t: uw 超廣角 / main 主鏡頭 / crop 主鏡頭裁切 / tele 長焦；f 光圈；big=大底主攝
const L=(z,mm,t,f,note)=>({z,mm,t,f,note});
const PHONES=[
 {id:"ip17pm",name:"iPhone 17 Pro Max",m:[/iPhone 17 Pro Max/i],lenses:[L(.5,13,"uw",2.2),L(1,24,"main",1.78),L(2,48,"crop",1.78),L(4,100,"tele",2.8),L(8,200,"crop",2.8)],macro:"uw"},
 {id:"ip17p",name:"iPhone 17 Pro",m:[/iPhone 17 Pro(?! Max)/i],lenses:[L(.5,13,"uw",2.2),L(1,24,"main",1.78),L(2,48,"crop",1.78),L(4,100,"tele",2.8),L(8,200,"crop",2.8)],macro:"uw"},

 {id:"ip17",name:"iPhone 17",m:[/iPhone 17(?! Pro)/i],lenses:[L(.5,13,"uw",2.2),L(1,26,"main",1.6),L(2,52,"crop",1.6)],macro:"uw"},
 {id:"ip16pm",name:"iPhone 16 Pro Max",m:[/iPhone 16 Pro Max/i],lenses:[L(.5,13,"uw",2.2),L(1,24,"main",1.78),L(2,48,"crop",1.78),L(5,120,"tele",2.8)],macro:"uw"},
 {id:"ip16p",name:"iPhone 16 Pro",m:[/iPhone 16 Pro(?! Max)/i],lenses:[L(.5,13,"uw",2.2),L(1,24,"main",1.78),L(2,48,"crop",1.78),L(5,120,"tele",2.8)],macro:"uw"},
 {id:"ip16",name:"iPhone 16 / 16 Plus",m:[/iPhone 16( Plus)?$/i],lenses:[L(.5,13,"uw",2.2),L(1,26,"main",1.6),L(2,52,"crop",1.6)],macro:"uw"},
 {id:"ip16e",name:"iPhone 16e",m:[/iPhone 16e/i],lenses:[L(1,26,"main",1.6),L(2,52,"crop",1.6)],macro:null},
 {id:"ip15pm",name:"iPhone 15 Pro Max",m:[/iPhone 15 Pro Max/i],lenses:[L(.5,13,"uw",2.2),L(1,24,"main",1.78),L(2,48,"crop",1.78),L(5,120,"tele",2.8)],macro:"uw"},
 {id:"ip15p",name:"iPhone 15 Pro",m:[/iPhone 15 Pro(?! Max)/i],lenses:[L(.5,13,"uw",2.2),L(1,24,"main",1.78),L(2,48,"crop",1.78),L(3,77,"tele",2.8)],macro:"uw"},
 {id:"ip15",name:"iPhone 15 / 15 Plus",m:[/iPhone 15( Plus)?$/i],lenses:[L(.5,13,"uw",2.4),L(1,26,"main",1.6),L(2,52,"crop",1.6)],macro:null},
 {id:"ip14p",name:"iPhone 14 Pro / Pro Max",m:[/iPhone 14 Pro/i],lenses:[L(.5,13,"uw",2.2),L(1,24,"main",1.78),L(2,48,"crop",1.78),L(3,77,"tele",2.8)],macro:"uw"},
 {id:"ip13p",name:"iPhone 13 Pro / Pro Max",m:[/iPhone 13 Pro/i],lenses:[L(.5,13,"uw",1.8),L(1,26,"main",1.5),L(3,77,"tele",2.8)],macro:"uw"},
 {id:"ip1314",name:"iPhone 13 / 14 系列（非 Pro）",m:[/iPhone 1[34]( Plus| mini)?$/i],lenses:[L(.5,13,"uw",2.4),L(1,26,"main",1.5)],macro:null},
 {id:"s25u",name:"Samsung Galaxy S25 Ultra",m:[/SM-S938/i,/S25 Ultra/i],lenses:[L(.6,13,"uw",1.9),L(1,23,"main",1.7),L(2,46,"crop",1.7),L(3,67,"tele",2.4),L(5,111,"tele",3.4),L(10,230,"crop",3.4)],macro:"uw"},
 {id:"s24u",name:"Samsung Galaxy S24 Ultra",m:[/SM-S928/i,/S24 Ultra/i],lenses:[L(.6,13,"uw",2.2),L(1,23,"main",1.7),L(2,46,"crop",1.7),L(3,67,"tele",2.4),L(5,111,"tele",3.4),L(10,230,"crop",3.4)],macro:null},
 {id:"s25",name:"Samsung Galaxy S24 / S25（含 +）",m:[/SM-S9(2[16]|3[16])/i,/Galaxy S2[45]\+?$/i],lenses:[L(.6,13,"uw",2.2),L(1,24,"main",1.8),L(2,48,"crop",1.8),L(3,67,"tele",2.4)],macro:null},
 {id:"px10p",name:"Google Pixel 9 Pro / 10 Pro（含 XL）",m:[/Pixel (9|10) Pro/i],lenses:[L(.5,13,"uw",1.7),L(1,25,"main",1.68),L(2,50,"crop",1.68),L(5,113,"tele",2.8)],macro:"uw"},
 {id:"px10",name:"Google Pixel 10",m:[/Pixel 10$/i],lenses:[L(.5,13,"uw",2.2),L(1,25,"main",1.7),L(2,50,"crop",1.7),L(5,113,"tele",3.1)],macro:"uw"},
 {id:"px9",name:"Google Pixel 9",m:[/Pixel 9$/i],lenses:[L(.5,13,"uw",1.7),L(1,25,"main",1.68),L(2,50,"crop",1.68)],macro:"uw"},
 {id:"mi15u",name:"小米 15 Ultra",m:[/15 Ultra/i,/25010PN30/i],lenses:[L(.6,14,"uw",2.2),L(1,23,"main",1.63,"一吋大底"),L(3,70,"tele",1.8),L(4.3,100,"tele",2.6)],macro:"tele"},
 {id:"mi14u",name:"小米 14 Ultra",m:[/14 Ultra/i,/24030PN60/i],lenses:[L(.5,12,"uw",1.8),L(1,23,"main",1.63,"一吋大底"),L(3.2,75,"tele",1.8),L(5,120,"tele",2.5)],macro:"tele"},
 {id:"x200p",name:"vivo X200 Pro",m:[/X200 Pro/i],lenses:[L(.6,15,"uw",2.0),L(1,24,"main",1.57),L(2,48,"crop",1.57),L(3.7,85,"tele",2.67)],macro:"tele"},
 {id:"x100p",name:"vivo X100 Pro",m:[/X100 Pro/i],lenses:[L(.6,15,"uw",2.0),L(1,23,"main",1.75,"一吋大底"),L(2,46,"crop",1.75),L(4.3,100,"tele",2.5)],macro:"tele"},
 {id:"fx8u",name:"OPPO Find X8 Ultra",m:[/Find X8 Ultra/i,/PKJ110/i],lenses:[L(.6,15,"uw",2.0),L(1,23,"main",1.8,"一吋大底"),L(3,70,"tele",2.1),L(6,135,"tele",3.1)],macro:"tele"},
 {id:"fx8p",name:"OPPO Find X8 Pro",m:[/Find X8 Pro/i],lenses:[L(.6,15,"uw",2.0),L(1,24,"main",1.6),L(3,73,"tele",2.6),L(6,135,"tele",4.3)],macro:"tele"},
 {id:"p70u",name:"華為 Pura 70 Ultra",m:[/Pura 70 Ultra/i,/HBP-/i],lenses:[L(.5,13,"uw",2.2),L(1,23,"main",1.6,"一吋大底"),L(3.5,90,"tele",2.1)],macro:"tele"},
 {id:"mate70p",name:"華為 Mate 60 / 70 Pro 系列",m:[/Mate (60|70) Pro/i],lenses:[L(.5,13,"uw",2.2),L(1,24,"main",1.4,"可變光圈"),L(3.5,90,"tele",2.1)],macro:"tele"},
 {id:"m7p",name:"榮耀 Magic7 Pro",m:[/Magic7 Pro/i,/PTP-/i],lenses:[L(.5,13,"uw",2.0),L(1,23,"main",1.4,"可變光圈"),L(3,70,"tele",2.6)],macro:"tele"},
 {id:"op13",name:"OnePlus 13",m:[/OnePlus 13|PJZ110|CPH2649/i],lenses:[L(.6,15,"uw",2.0),L(1,23,"main",1.6),L(3,73,"tele",2.6)],macro:"tele"},
 {id:"custom",name:"其他 / 自訂倍數",m:[],lenses:null,macro:"uw"}
];
// iPhone 以螢幕尺寸縮小範圍（瀏覽器不會告訴網頁確切型號）
const IPHONE_SCREENS={
 "440x956":["ip16pm","ip17pm"],"402x874":["ip16p","ip17","ip17p"],"420x912":["ipair"],
 "430x932":["ip15pm","ip16","ip15","ip14p"],"393x852":["ip15p","ip15","ip16","ip14p"],
 "390x844":["ip16e","ip1314","ip13p"],"428x926":["ip13p","ip1314"]
};

/* ---------------- 情境 ---------------- */
const SCENES={
 portrait:{name:"人像",size:1.8,dist:3,ideal:[50,90],tip:"人像"},
 landscape:{name:"風景",size:null,dist:200,ideal:null},
 arch:{name:"建築",size:25,dist:40,ideal:[24,70]},
 food:{name:"美食",size:.35,dist:.45,ideal:[40,60]},
 pet:{name:"寵物",size:.6,dist:1.5,ideal:[40,90]},
 product:{name:"商品/靜物",size:.3,dist:.6,ideal:[50,100]},
 street:{name:"街拍",size:null,dist:6,ideal:[24,50]},
 night:{name:"夜景",size:null,dist:50,ideal:null},
 macro:{name:"微距/花",size:.05,dist:.08,ideal:null}
};
const FRAMING={full:["全身",1.8],half:["半身",.9],head:["特寫",.4],group:["團體",3]};

/* ---------------- 狀態 ---------------- */
const S={phone:null,scene:"portrait",framing:"half",dist:3,size:.9,photo:null,metrics:null,exif:null,ai:null};
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// 對數滑桿
const DMIN=.05,DMAX=2000,ZMIN=.03,ZMAX=200;
const logTo=(v,a,b)=>a*Math.pow(b/a,v/1000), toLog=(x,a,b)=>Math.round(1000*Math.log(x/a)/Math.log(b/a));
const fmtM=m=>m<1?Math.round(m*100)+" cm":m<10?m.toFixed(1).replace(/\.0$/,"")+" m":Math.round(m)+" m";
const fmtZ=z=>(Math.round(z*10)/10).toString().replace(/\.0$/,"");

/* ---------------- 機型辨識 ---------------- */
function findByModel(str){
  if(!str)return null;
  for(const p of PHONES) if(p.m.some(r=>r.test(str))) return p;
  return null;
}
async function detect(){
  const ua=navigator.userAgent;let found=null,how="",cands=null;
  // App 版：直接向 Android 系統讀取型號（Build.MODEL）
  try{
    const Dev=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Device;
    if(Dev){const info=await Dev.getInfo();
      if(info&&info.model){found=findByModel(info.model)||findByModel((info.manufacturer||"")+" "+info.model);
        how=`系統回報：${info.manufacturer||""} ${info.model}`+(found?"":"（資料庫還沒有，請手動選）");
        if(found){$("detect").innerHTML=`<b>✓ 已辨識</b>　`+how;setPhone(found.id);return;}}}
  }catch(e){}
  try{
    if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues){
      const h=await navigator.userAgentData.getHighEntropyValues(["model"]);
      if(h.model){found=findByModel(h.model);how=`瀏覽器回報型號「${h.model}」`;if(!found)how+="（資料庫還沒有，請手動選）";}
    }
  }catch(e){}
  if(!found){
    const am=ua.match(/Android [\d.]+; ([^;)]+)/);
    if(am&&am[1]!=="K"){found=findByModel(am[1]);if(!how)how=`裝置代號「${am[1].trim()}」`;}
  }
  if(!found&&/iPhone/.test(ua)){
    const w=Math.min(screen.width,screen.height),h=Math.max(screen.width,screen.height);
    cands=IPHONE_SCREENS[w+"x"+h];
    how=cands?`偵測到 iPhone（螢幕 ${w}×${h}），可能是：${cands.map(id=>PHONES.find(p=>p.id===id).name).join("、")}。iPhone 不會告訴網頁確切型號，請確認一下；或拍張測試照，我從照片資訊讀取。`:"偵測到 iPhone，但無法判斷型號，請手動選擇或拍張測試照。";
    if(cands)found=PHONES.find(p=>p.id===cands[0]);
  }
  const saved=store.get("lensPhone");
  if(saved&&!(found&&!cands)){const p=PHONES.find(x=>x.id===saved);if(p){found=p;how="使用上次選擇的機型";}}
  if(!found){found=PHONES.find(p=>p.id==="custom");if(!how)how="無法自動辨識（可能在電腦上開啟），請手動選擇；拍一張測試照也能從照片辨識。";}
  $("detect").innerHTML=(found&&found.id!=="custom"&&!cands?`<b>✓ 已辨識</b>　`:"")+how;
  setPhone(found.id);
}
function setPhone(id){
  S.phone=PHONES.find(p=>p.id===id);$("phone").value=id;store.set("lensPhone",id);
  $("customBox").style.display=id==="custom"?"block":"none";
  renderLenses();update();
}
function lensesOf(){
  if(S.phone.lenses)return S.phone.lenses;
  const zs=$("customPreset").value.split(",").map(Number);
  return zs.map(z=>z<1?L(z,26*z,"uw",2.2):z===1?L(1,26,"main",1.7):L(z,26*z,z===2&&!zs.includes(3)&&zs.length<=3?"crop":"tele",2.6));
}
function renderLenses(){
  $("lenses").innerHTML=lensesOf().map(l=>`<span class="lens ${l.t==="crop"?"crop":""}">${fmtZ(l.z)}×<small>${l.mm}mm${l.t==="crop"?" 裁切":l.t==="uw"?" 超廣":l.t==="tele"?" 長焦":" 主鏡"}</small></span>`).join("");
}

/* ---------------- 照片分析 ---------------- */
async function loadPhoto(file){
  if(!file)return;
  S.ai=null;
  let exif=null;
  try{ if(window.exifr) exif=await exifr.parse(file,["Make","Model","FocalLengthIn35mmFormat","FocalLength","ISO","ExposureTime","FNumber","LensModel","BrightnessValue"]); }catch(e){}
  S.exif=exif||{};
  if(exif&&exif.Model){
    const p=findByModel(exif.Model)||findByModel((exif.Make||"")+" "+exif.Model);
    if(p){setPhone(p.id);$("detect").innerHTML=`<b>✓ 從照片辨識</b>　${exif.Make||""} ${exif.Model}`;}
    else $("detect").innerHTML=`照片顯示是「${exif.Make||""} ${exif.Model}」，資料庫裡還沒有，請選最接近的機型或自訂倍數。`;
  }
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{S.photo=img;analyze(img);drawOverlay();update();};
  img.onerror=()=>{$("metrics").innerHTML=`<span class="m warn"><b>這個格式無法在瀏覽器預覽，請改用 JPG</b></span>`;};
  img.src=url;
}
function analyze(img){
  const W=200,H=Math.round(200*img.naturalHeight/img.naturalWidth);
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.drawImage(img,0,0,W,H);
  const d=x.getImageData(0,0,W,H).data;const Y=new Float32Array(W*H);
  let sum=0,hi=0,lo=0,sat=0,warm=0,cen=0,cn=0,edge=0,en=0,top=0,tn=0;
  for(let i=0;i<W*H;i++){
    const r=d[i*4],g=d[i*4+1],b=d[i*4+2];const y=.299*r+.587*g+.114*b;Y[i]=y;sum+=y;
    if(y>248)hi++; if(y<8)lo++;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b);sat+=mx?(mx-mn)/mx:0;warm+=(r-b);
    const px=i%W,py=(i/W)|0;
    if(px>W*.3&&px<W*.7&&py>H*.3&&py<H*.7){cen+=y;cn++;}
    if(py<H*.3){top+=y;tn++;}
  }
  for(let py=1;py<H-1;py++)for(let px=1;px<W-1;px++){const i=py*W+px;const gx=Y[i+1]-Y[i-1],gy=Y[i+W]-Y[i-W];if(gx*gx+gy*gy>900)edge++;en++;}
  const N=W*H,mean=sum/N,ce=cen/cn,edgeMean=(sum-cen)/(N-cn);
  S.metrics={mean,hiPct:hi/N*100,loPct:lo/N*100,sat:sat/N,warm:warm/N,backlit:edgeMean>ce*1.45&&edgeMean>110,topBright:top/tn,detail:edge/en*100,
    iso:S.exif.ISO,exp:S.exif.ExposureTime,fl35:S.exif.FocalLengthIn35mmFormat};
  const m=S.metrics,lowLight=isLowLight();
  const tags=[
    [`亮度`,m.mean<60?"偏暗":m.mean>190?"很亮":"正常",m.mean<60],
    [`過曝`,m.hiPct.toFixed(1)+"%",m.hiPct>6],
    [`細節`,m.detail>22?"繁雜":m.detail<7?"簡潔":"適中",false],
    [`色調`,m.warm>18?"暖":m.warm<-8?"冷":"中性",false],
  ];
  if(m.backlit)tags.push(["光線","逆光",true]);
  if(m.iso)tags.push(["ISO",m.iso,m.iso>=800]);
  if(m.exp)tags.push(["快門",m.exp>=1?m.exp+"s":"1/"+Math.round(1/m.exp),m.exp>1/30]);
  if(m.fl35)tags.push(["焦距",m.fl35+"mm",false]);
  if(lowLight)tags.push(["判定","低光源",true]);
  $("metrics").innerHTML=tags.map(([a,b,w])=>`<span class="m ${w?"warn":""}">${a} <b>${b}</b></span>`).join("");
}
function isLowLight(){
  const m=S.metrics;if(S.scene==="night")return true;if(!m)return false;
  if(m.iso&&m.iso>=640)return true; if(m.exp&&m.exp>=1/20)return true;
  return m.mean<55;
}

/* ---------------- 推薦引擎 ---------------- */
function mainMm(){const m=lensesOf().find(l=>l.z===1);return m?m.mm:26}
function pickLens(targetZ,low){
  let best=null,bs=1e9;
  for(const l of lensesOf()){
    let s=Math.abs(Math.log(l.z/targetZ));
    if(l.t==="crop")s+=.12;
    if(l.z>targetZ*1.15)s+=.35;            // 太窄會切到主體，比稍廣更糟（稍廣還能裁）
    if(low&&l.t==="tele")s+=l.f>=2.8?.9:.45;
    if(low&&l.t==="uw")s+=.5;
    if(low&&l.t==="crop"&&l.z>4)s+=.6;
    if(s<bs){bs=s;best=l;}
  }
  return best;
}
const FILL=.75,FRAME=36; // 主體佔畫面長邊 75%，35mm 長邊 36mm
const focalFor=(d,size)=>FRAME*d/(size/FILL);
const distFor=(mm,size)=>mm*(size/FILL)/FRAME;

function recommend(){
  const sc=S.scene,low=isLowLight(),m=S.metrics,lens=lensesOf(),main=mainMm(),d=S.dist,sz=S.size;
  const has=t=>lens.some(l=>l.t===t);const tele=lens.filter(l=>l.t==="tele");
  let target,reasons=[],pos=[],warn=[],alts=[];
  const lensName=l=>`${fmtZ(l.z)}×（${l.mm}mm${l.t==="tele"?" 長焦":l.t==="uw"?" 超廣角":l.t==="crop"?" 主鏡裁切":" 主鏡頭"}）`;

  if(["portrait","food","pet","product","arch"].includes(sc)){
    const need=focalFor(d,sz);target=need/main;
    reasons.push(`在 ${fmtM(d)} 拍 ${fmtM(sz)} 的主體，要讓它填滿畫面約需 ${Math.round(need)}mm 等效焦距 ≈ ${fmtZ(target)}×。`);
  }
  let chosen;
  switch(sc){
   case "portrait":{
     chosen=pickLens(target,low);
     const idealL=pickLens(Math.max(2,70/main),low);
     if(chosen.mm<35)warn.push(`${fmtZ(chosen.z)}× 拍人臉會放大鼻子、拉長臉型；人像最好在 50–90mm。`);
     if(idealL&&idealL!==chosen&&(chosen.mm<45||chosen.mm>140)){const dd=distFor(idealL.mm,sz);
       pos.push(`更好的做法：${dd>d?"往後退":"往前走"}到離主體約 ${fmtM(dd)}，改用 ${lensName(idealL)}，臉型更自然、背景更柔。`);
       alts.push({l:idealL,why:`站在 ${fmtM(dd)} 時的最佳人像焦段`});}
     pos.push(S.framing==="full"?"相機放在對方腰部高度、略往上拍，腿會顯長；腳底留一點空間不要切到腳。":S.framing==="head"?"相機與眼睛同高或略高，眼睛放在畫面上方三分之一線。":"相機與胸口到眼睛之間同高，切在腰或手肘上方，不要切在關節。");
     pos.push("讓人和背景保持距離（2 公尺以上），背景虛化才明顯；可開人像模式。");
     break;}
   case "food":
     chosen=pickLens(Math.max(target,1.6),low);
     reasons.push("美食用 2× 左右能避免近拍變形，盤子邊緣才不會歪。");
     pos.push("平面擺盤（披薩、便當）從正上方俯拍；有高度的（漢堡、飲料）用 30–45° 斜拍。",`用 2× 時距離約 ${fmtM(distFor(2*main,sz))}，手機盡量與桌面保持平行。`,"讓光從側後方來（靠窗座位），避免自己的影子落在食物上。");
     break;
   case "pet":
     chosen=pickLens(target,low);
     pos.push("蹲低到寵物眼睛高度，比從上往下拍更有神。","對焦在眼睛；會動的話開連拍。");
     if(low&&chosen.t==="tele")warn.push("室內偏暗時長焦容易手震糊掉，寧可用 1×/2× 再走近。");
     break;
   case "product":
     chosen=pickLens(Math.max(target,2),low);
     reasons.push("商品照用中長焦，透視壓縮後比例最接近肉眼。");
     pos.push(`距離約 ${fmtM(distFor(chosen.mm,sz))}，相機與商品中心同高，正面或 30° 側拍。`,"背景用素色牆或大張白紙，光從側邊打、另一側放白紙反光。");
     break;
   case "arch":{
     chosen=pickLens(target,low);
     if(target<1&&has("uw")){reasons.push("太近了，只能用超廣角才裝得下。");
       const dd=distFor(main*2,sz);pos.push(`超廣角會讓建築往後倒。如果能退到約 ${fmtM(dd)} 外改用 2×，線條會直很多。`);
       warn.push("用超廣角時把手機保持垂直（不要仰拍），之後再裁切，可減少梯形變形。");}
     else pos.push("站遠一點用長焦，比站近仰拍更能保持垂直線不歪。","開啟相機格線，讓建築垂直線對齊格線。");
     if(m&&m.topBright>200)pos.push("天空很亮：點一下建築對焦，往下拉曝光，避免天空一片白。");
     break;}
   case "landscape":{
     if(d<30&&has("uw")){chosen=lens.find(l=>l.t==="uw");reasons.push("前景很近，用超廣角做出「近大遠小」的縱深感。");
       pos.push("把相機放低（膝蓋高或更低），讓前景的石頭、花、步道佔畫面下方三分之一。");}
     else if(d>=300&&tele.length&&!low){chosen=pickLens(tele.length>1?4:tele[0].z,low);reasons.push("主體很遠，長焦會壓縮距離，讓遠山、夕陽看起來又大又有層次。");
       pos.push("找一個有前後層次的方向（山稜、樹林、建築一層層疊起來）。");
       alts.push({l:lens.find(l=>l.z===1),why:"想交代整個環境時"});}
     else{chosen=lens.find(l=>l.z===1);reasons.push("中距離風景用主鏡頭畫質最好、動態範圍最大。");
       if(has("uw"))alts.push({l:lens.find(l=>l.t==="uw"),why:"天空很壯觀或想要更開闊"});}
     pos.push(m&&m.topBright>m.mean*1.2?"天空比地面亮很多：地平線放在畫面下三分之一，並往下拉曝光保留雲層。":"地平線放在上或下三分之一，不要切在正中間；開格線確保水平。");
     break;}
   case "street":
     chosen=pickLens(d>8?2:1,low);
     reasons.push("街拍 1×–2× 最接近人眼視角，有現場感。");
     pos.push("先找好光線與背景（有光影、有招牌、有線條的地方），等路人走進畫面再按。","相機放在腰部或胸口高度，看起來比較自然。");
     break;
   case "night":
     chosen=lens.find(l=>l.z===1)||lens[0];
     reasons.push("夜景一律優先用 1× 主鏡頭：感光元件最大、光圈最亮，雜訊最少。");
     if(tele.length)warn.push(`暗處按 ${fmtZ(tele[0].z)}× 時，不少手機其實會偷偷改用主鏡頭裁切，畫質更差；真的要拉近，用 2× 就好。`);
     if(has("crop"))alts.push({l:lens.find(l=>l.t==="crop"),why:"想拉近一點時，仍用主鏡頭的像素"});
     pos.push("靠在欄杆、牆壁或放在桌上穩住手機，讓夜景模式跑完 3 秒再移開。","避免路燈直接入鏡造成眩光，換個角度讓燈在畫面邊緣或被建築擋住。");
     break;
   case "macro":
     if(S.phone.macro==="tele"&&tele.length){chosen=tele[0];reasons.push(`你的手機支援長焦微距，用 ${fmtZ(chosen.z)}× 在約 10–30 cm 拍，背景虛化更好看、也不會擋到光。`);pos.push("距離約 15–25 cm，慢慢前後移動直到對到焦。");}
     else if(S.phone.macro==="uw"&&has("uw")){chosen=lens.find(l=>l.t==="uw");reasons.push("靠近到 2–5 cm 時手機會自動切到超廣角微距（畫面會出現小花圖示）。");pos.push("手機靠近到 3 cm 左右，注意不要擋住光。");}
     else{chosen=pickLens(2,low);reasons.push("這支手機沒有微距鏡頭，用 2× 在最近對焦距離（約 15 cm）拍，再裁切。");pos.push("太近會對不到焦，手機往後退到畫面清晰為止。");}
     pos.push("在陰天或樹蔭下拍花最柔和；有風時等葉子停下來。");
     break;
  }
  if(!chosen)chosen=lens.find(l=>l.z===1)||lens[0];

  // 光線
  if(low&&chosen.t==="tele")warn.push(`光線不足，長焦（f/${chosen.f}）可能糊；拍不清楚就改 ${fmtZ((lens.find(l=>l.t==="crop")||lens.find(l=>l.z===1)).z)}×。`);
  if(low&&sc!=="night")reasons.push("現場偏暗，已優先選擇進光量較大的鏡頭。");
  if(m&&m.backlit)pos.push("主體逆光：繞到讓光從你側面或身後照向主體的位置；若想保留逆光氛圍，點主體對焦並把曝光往上拉。");
  if(m&&m.hiPct>8)warn.push(`畫面有 ${m.hiPct.toFixed(0)}% 過曝，對焦後往下拉曝光，或換角度避開亮處。`);
  if(m&&m.detail>24&&["portrait","pet","product","food"].includes(sc))pos.push("背景很雜亂：換個方向讓背景是牆、天空或樹叢，或用更長的焦段縮小背景範圍。");
  if(chosen.t==="crop")reasons.push(`${fmtZ(chosen.z)}× 是主鏡頭中央裁切，畫質仍很好，只是解析度較低。`);
  if(chosen.t==="tele"&&!low)reasons.push(`${fmtZ(chosen.z)}× 是光學長焦，焦段壓縮感讓背景顯得更近、更乾淨。`);

  // 實際距離提示
  if(["portrait","pet","product","food","arch"].includes(sc)&&target){
    const fit=distFor(chosen.mm,sz);
    if(Math.abs(Math.log(fit/d))>.25)pos.unshift(`用 ${fmtZ(chosen.z)}× 時，最理想的站位是離主體 ${fmtM(fit)}（目前 ${fmtM(d)}，${fit>d?"往後退":"往前走"} ${fmtM(Math.abs(fit-d))}）。`);
    else pos.unshift(`你現在的距離（${fmtM(d)}）很合適，不用移動。`);
  }
  alts=alts.filter(a=>a.l&&a.l!==chosen);
  return {chosen,reasons,pos,warn,alts,lensName,low};
}

/* ---------------- 繪製 ---------------- */
function drawOverlay(){
  const img=S.photo;if(!img)return;
  const cv=$("cv"),W=Math.min(1200,img.naturalWidth),H=Math.round(W*img.naturalHeight/img.naturalWidth);
  cv.width=W;cv.height=H;const x=cv.getContext("2d");x.drawImage(img,0,0,W,H);$("stage").style.display="block";
  const lw=Math.max(2,W/300);
  x.strokeStyle="rgba(255,255,255,.35)";x.lineWidth=lw/1.5;
  for(const k of[1,2]){x.beginPath();x.moveTo(W*k/3,0);x.lineTo(W*k/3,H);x.moveTo(0,H*k/3);x.lineTo(W,H*k/3);x.stroke();}
  const r=recommend();const photoZ=(S.metrics&&S.metrics.fl35?S.metrics.fl35:mainMm())/mainMm();
  let z=(S.ai&&S.ai.recommended_zoom)||r.chosen.z;const ratio=z/photoZ;
  let cx=W/2,cy=H/2;
  if(S.ai&&S.ai.aim_point){cx=S.ai.aim_point.x*W;cy=S.ai.aim_point.y*H;}
  x.font=`700 ${Math.round(W/26)}px "JetBrains Mono",monospace`;
  if(ratio>1.05){
    const fw=W/ratio,fh=H/ratio;cx=Math.min(Math.max(cx,fw/2),W-fw/2);cy=Math.min(Math.max(cy,fh/2),H-fh/2);
    x.fillStyle="rgba(0,0,0,.45)";x.beginPath();x.rect(0,0,W,H);x.rect(cx-fw/2,cy-fh/2,fw,fh);x.fill("evenodd");
    x.strokeStyle="#ffb627";x.lineWidth=lw*1.5;x.strokeRect(cx-fw/2,cy-fh/2,fw,fh);
    x.fillStyle="#ffb627";x.fillText(fmtZ(z)+"× 的畫面",cx-fw/2+lw*3,cy-fh/2+W/22);
    if(S.ai&&S.ai.aim_point){x.beginPath();x.arc(cx,cy,W/60,0,7);x.stroke();}
  }else if(ratio<.95){
    x.strokeStyle="#ffb627";x.lineWidth=lw*3;x.setLineDash([lw*6,lw*4]);x.strokeRect(lw,lw,W-2*lw,H-2*lw);x.setLineDash([]);
    x.fillStyle="#ffb627";x.fillText(fmtZ(z)+"× 會比這張更廣 ↔",lw*5,W/18);
  }else{x.fillStyle="#ffb627";x.fillText(fmtZ(z)+"× ≈ 目前畫面",lw*5,W/18);}
}

function update(){
  if(!S.phone)return;
  const r=recommend(),c=r.chosen;const ai=S.ai;
  const showZ=ai&&ai.recommended_zoom?ai.recommended_zoom:c.z;
  const lensForZ=lensesOf().reduce((a,b)=>Math.abs(b.z-showZ)<Math.abs(a.z-showZ)?b:a);
  let h=`<h2><span class="n">→</span>建議</h2>
  <div class="big"><div class="zoom">${fmtZ(showZ)}<span>×</span></div>
  <div class="zinfo"><div class="t">${SCENES[S.scene].name}・${lensForZ.mm}mm${lensForZ.t==="tele"?" 長焦":lensForZ.t==="uw"?" 超廣角":lensForZ.t==="crop"?" 主鏡裁切":" 主鏡頭"}</div>
  <div class="d">${S.phone.id==="custom"?"自訂機型":S.phone.name} ・ f/${lensForZ.f}${lensForZ.note?" ・ "+lensForZ.note:""}${ai?" ・ AI 已看過照片":""}</div></div></div>`;
  if(ai){
    h+=`<div class="aiout"><span class="badge">AI</span>${esc(ai.summary||"")}</div>`;
    if(ai.reasons&&ai.reasons.length)h+=`<div class="sec"><h3>為什麼</h3><ul>${ai.reasons.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`;
    const p=ai.position||{};const pl=[p.move,p.height,p.angle,p.light].filter(Boolean);
    if(pl.length||(ai.composition||[]).length)h+=`<div class="sec pos"><h3>站位與構圖</h3><ul>${pl.concat(ai.composition||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`;
    if(ai.avoid&&ai.avoid.length)h+=`<div class="sec warnl"><h3>注意</h3><ul>${ai.avoid.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`;
    if(ai.alternatives&&ai.alternatives.length)h+=`<div class="sec"><h3>也可以試</h3><div class="alts">${ai.alternatives.map(a=>`<div class="alt"><b>${fmtZ(a.zoom)}×</b><span>${esc(a.why)}</span></div>`).join("")}</div></div>`;
  }else{
    h+=`<div class="sec"><h3>為什麼</h3><ul>${r.reasons.map(t=>`<li>${t}</li>`).join("")}</ul></div>`;
    if(r.pos.length)h+=`<div class="sec pos"><h3>站位與構圖</h3><ul>${r.pos.map(t=>`<li>${t}</li>`).join("")}</ul></div>`;
    if(r.warn.length)h+=`<div class="sec warnl"><h3>注意</h3><ul>${r.warn.map(t=>`<li>${t}</li>`).join("")}</ul></div>`;
    if(r.alts.length)h+=`<div class="sec"><h3>也可以試</h3><div class="alts">${r.alts.map(a=>`<div class="alt"><b>${fmtZ(a.l.z)}×</b><span>${a.why}</span></div>`).join("")}</div></div>`;
  }
  h+=`<div class="ai" id="aiBox"></div>`;
  $("result").innerHTML=h;renderAI();
  if(S.photo)drawOverlay();
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- AI 看圖 ---------------- */
let sampleFn=null,sampleImg=false,aiBusy=false,aiErr="";
function renderAI(){
  const box=$("aiBox");if(!box)return;
  if(!sampleFn){box.style.display="none";return;}
  box.style.display="block";
  if(!S.photo){box.innerHTML=`<div class="hint">拍一張測試照後，可以讓 AI 看現場畫面，給出更準的倍數與站位（例如背景哪裡雜、光從哪來、往哪邊走）。</div>`;return;}
  if(!sampleImg){box.innerHTML=`<div class="hint">目前環境無法把照片交給 AI 分析，以上為依測光數據的建議。</div>`;return;}
  box.innerHTML=`<button class="btn primary" id="aiBtn" style="width:100%" ${aiBusy?"disabled":""}>${aiBusy?'<span class="spin"></span>AI 正在看現場…':S.ai?"重新分析":"✨ 讓 AI 看照片，給精準建議"}</button>${aiErr?`<div class="err">${esc(aiErr)}</div>`:""}${S.ai?`<div class="hint">畫面上的橘框＝建議倍數會拍到的範圍，圓圈＝建議對準的位置。<a href="#" id="aiReset" style="color:var(--mute)">改回基本建議</a></div>`:""}`;
  $("aiBtn").onclick=runAI;
  const rs=$("aiReset");if(rs)rs.onclick=e=>{e.preventDefault();S.ai=null;update();};
}
async function toBlob(img){
  const W=Math.min(1024,img.naturalWidth),H=Math.round(W*img.naturalHeight/img.naturalWidth);
  const c=document.createElement("canvas");c.width=W;c.height=H;c.getContext("2d").drawImage(img,0,0,W,H);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
}
async function runAI(){
  if(aiBusy)return;aiBusy=true;aiErr="";renderAI();
  try{
    const blob=await toBlob(S.photo);const r=recommend();const m=S.metrics||{};
    const photoZ=((m.fl35||mainMm())/mainMm());
    const prompt=`你是專業手機攝影教練。使用者用手機拍了一張「現場測試照」（約 ${fmtZ(photoZ)}× 視角），想知道該用幾倍鏡頭拍、站在哪裡。請仔細看照片判斷主體、背景、光線方向、空間與障礙物。

手機：${S.phone.id==="custom"?"未知機型":S.phone.name}
可用倍數（35mm 等效焦距、類型、光圈）：${lensesOf().map(l=>`${fmtZ(l.z)}x=${l.mm}mm ${l.t==="crop"?"主鏡裁切":l.t==="tele"?"光學長焦":l.t==="uw"?"超廣角":"主鏡頭"} f/${l.f}`).join("；")}
微距方式：${S.phone.macro==="tele"?"長焦微距":S.phone.macro==="uw"?"超廣角微距":"無"}
使用者選的情境：${SCENES[S.scene].name}${S.scene==="portrait"?"（"+FRAMING[S.framing][0]+"）":""}；自述距離約 ${fmtM(S.dist)}，主體大小約 ${fmtM(S.size)}
測光：平均亮度 ${Math.round(m.mean||0)}/255、過曝 ${(m.hiPct||0).toFixed(1)}%、${m.backlit?"疑似逆光、":""}${m.iso?"ISO "+m.iso+"、":""}${m.exp?"快門 "+m.exp+"s":""}
初步規則建議：${fmtZ(r.chosen.z)}×

只回傳一個 JSON 物件（不要 markdown），全部用繁體中文，句子短而具體（可直接照做，帶數字與方向，例如「往左走兩步」「蹲到膝蓋高度」）：
{"recommended_zoom": 數字（必須是上面可用倍數之一）,
 "summary": "一句話結論",
 "scene": "你看到的場景",
 "reasons": ["為什麼選這個倍數，最多3點"],
 "position": {"move":"往哪個方向移動多少","height":"相機高度","angle":"角度/方向","light":"光線處理"},
 "composition": ["構圖建議，最多3點，可參考照片中具體物件"],
 "avoid": ["要避開的問題，最多2點，沒有就空陣列"],
 "alternatives": [{"zoom":數字,"why":"什麼情況改用"}],
 "aim_point": {"x":0到1,"y":0到1}  // 在這張照片中，建議把畫面中心對準的位置（主體或構圖重點）
}`;
    const res=await sampleFn(prompt,{images:[blob],modelTier:"default"});
    const t=res.text||"";const j=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));
    const zs=lensesOf().map(l=>l.z);
    if(typeof j.recommended_zoom!=="number"||!zs.length)throw new Error("bad");
    j.recommended_zoom=zs.reduce((a,b)=>Math.abs(b-j.recommended_zoom)<Math.abs(a-j.recommended_zoom)?b:a);
    if(j.aim_point&&!(j.aim_point.x>=0&&j.aim_point.x<=1&&j.aim_point.y>=0&&j.aim_point.y<=1))j.aim_point=null;
    S.ai=j;
  }catch(e){
    aiErr=e&&e.code==="not_granted"?"沒有取得 AI 使用權限。":e&&e.code==="rate_limited"?"使用太頻繁，請稍後再試。":"AI 分析失敗，請再試一次。";
    if(e&&e.code==="not_granted"){sampleFn=null;}
  }
  aiBusy=false;update();
}

/* ---------------- 介面 ---------------- */
function syncScene(){
  const sc=SCENES[S.scene];
  $("scenes").innerHTML=Object.entries(SCENES).map(([k,v])=>`<button class="chip ${k===S.scene?"on":""}" data-k="${k}">${v.name}</button>`).join("");
  $("framingRow").style.display=S.scene==="portrait"?"block":"none";
  $("framing").innerHTML=Object.entries(FRAMING).map(([k,v])=>`<button class="chip ${k===S.framing?"on":""}" data-k="${k}">${v[0]}</button>`).join("");
  $("sizeRow").style.display=sc.size==null?"none":"block";
}
function setDist(m){S.dist=m;$("dist").value=toLog(m,DMIN,DMAX);$("distV").textContent=fmtM(m);}
function setSize(m){S.size=m;$("size").value=toLog(m,ZMIN,ZMAX);$("sizeV").textContent=fmtM(m);}
$("scenes").onclick=e=>{const k=e.target.dataset.k;if(!k)return;S.scene=k;S.ai=null;const sc=SCENES[k];
  setDist(sc.dist);if(sc.size)setSize(k==="portrait"?FRAMING[S.framing][1]:sc.size);syncScene();update();};
$("framing").onclick=e=>{const k=e.target.dataset.k;if(!k)return;S.framing=k;S.ai=null;setSize(FRAMING[k][1]);syncScene();update();};
$("dist").oninput=e=>{const v=logTo(+e.target.value,DMIN,DMAX);S.dist=v<1?Math.round(v*100)/100:v<10?Math.round(v*10)/10:Math.round(v);$("distV").textContent=fmtM(S.dist);S.ai=null;update();};
$("size").oninput=e=>{const v=logTo(+e.target.value,ZMIN,ZMAX);S.size=v<1?Math.round(v*100)/100:v<10?Math.round(v*10)/10:Math.round(v);$("sizeV").textContent=fmtM(S.size);S.ai=null;update();};
$("phone").innerHTML=PHONES.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");
$("phone").onchange=e=>{S.ai=null;setPhone(e.target.value);};
$("customPreset").onchange=()=>{renderLenses();update();};
$("cam").onchange=e=>loadPhoto(e.target.files[0]);
$("lib").onchange=e=>loadPhoto(e.target.files[0]);

syncScene();setDist(3);setSize(.9);detect();

(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const s=await claude.use("sample");if(!s)return;
    sampleFn=s;
    try{const lim=await s.limits();sampleImg=!!(lim&&lim.images);}catch(e){sampleImg=false;}
    renderAI();
  }catch(e){}
})();
</script>
