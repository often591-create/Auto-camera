name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/ci.keystore; echo "Using fixed signing key"; else echo "No signing key secret, using debug key"; fi

      - name: Build APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AutoCamera-${{ github.run_number }}.apk
          cp helper/build/outputs/apk/release/helper-release.apk dist/AutoCamera-Helper-${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCamera-apk
          path: dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Auto Camera build ${{ github.run_number }}
          body: |
            AutoCamera-xx.apk：相机 App
            AutoCamera-Helper-xx.apk：配合系统相机的助手（悬浮窗、滤镜、水印）
            下载后在手机上打开安装（需要允许「安装未知来源应用」）。
          files: dist/*.apk
